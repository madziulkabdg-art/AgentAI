
name: Generuj post i grafikę AI

on:
  schedule:
    - cron: '7 9 * * 1,3,5'
      timezone: 'Europe/Warsaw'

  workflow_dispatch:
    inputs:
      force_new:
        description: 'Wymus nowy post i grafike AI'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitoring-agent
  cancel-in-progress: false

jobs:
  generate:
    name: Generowanie posta i grafiki
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdz konfiguracje API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Brak GROQ_API_KEY"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Brak CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Brak CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Generuj post i grafike AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE_NEW: ${{ inputs.force_new == true && '1' || '0' }}
          TZ: Europe/Warsaw
        run: |
          python agent.py

      - name: Sprawdz wygenerowane pliki
        run: |
          test -f docs/index.html
          test -f data/posts.json

          python - <<'PY'
          import json
          from pathlib import Path

          posts = json.loads(
              Path("data/posts.json").read_text(encoding="utf-8")
          )

          if not posts:
              raise RuntimeError("Brak wygenerowanych postow")

          post = posts[-1]
          image = post.get("image", "")

          if image:
              path = Path("docs") / image
              if not path.is_file():
                  raise RuntimeError(
                      f"Brak pliku grafiki: {path}"
                  )
              print("Grafika istnieje:", path)
          else:
              print("UWAGA: ostatni post nie ma grafiki")
          PY

      - name: Zapisz posty i grafiki na GitHubie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/ data/posts.json

          if git diff --cached --quiet; then
            echo "Brak nowych zmian do zapisania"
          else
            git commit -m "AI: nowy post i grafika"
            git push origin HEAD:main
            echo "Posty i grafiki zapisane"
          fi

      - name: Zakonczenie
        run: |
          echo "Agent zakonczyl dzialanie"
          echo "Panel: https://emilrrs.github.io/kampania/"
